openapi: 3.0.3
info:
  title: Cloud Print Service API
  description: |
    Cloud printing service for ERP and WMS business systems.
    Provides fleet visibility, status query, and safe dispatch to label printers (ZPL),
    receipt printers (ESC/POS) and office printers (IPP, or PCL/PostScript on port 9100).

    A job carries a `format`. A printer lists the formats it takes as is (`formats`);
    a PDF, PNG or JPEG sent to a printer that does not take it is converted when the
    job is accepted — to a raster receipt, a ZPL graphic, PostScript or PCL — and the
    job records both (`source_format` → `format`). Printer languages (ZPL, ESC/POS,
    PCL, PostScript) are sent as is and never converted into one another.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Current Service Instance (API v1)
  - url: /
    description: Service Root (Ops & Specs)

tags:
  - name: Fleet Visibility
    description: Printer discovery, status monitoring, roll size configuration, and hardware queries.
  - name: Print Jobs
    description: Idempotent label dispatch, queue management, cancellation, and physical retry audits.
  - name: Real-Time Events
    description: Server-Sent Events (SSE) streaming live printer and job state transitions.
  - name: API Tokens
    description: Credential issuance, hashing, rotation, and revocation for business integrations.
  - name: Edge Agents
    description: Management of local PC agents forwarding USB label printers as network endpoints.
  - name: Network Discovery
    description: mDNS / DNS-SD discovery and human-controlled adoption of warehouse LAN printers.
  - name: Template Preview
    description: Server-side ZPL compilation and rasterization for previewing without printing.
  - name: System & Observability
    description: Health probes, Prometheus metrics, and OpenAPI documentation endpoints.

paths:
  # ---------------------------------------------------------------- Fleet Visibility
  /printers:
    get:
      tags:
        - Fleet Visibility
      summary: List Printers
      description: Returns all registered printers, optionally filtered by site, model, roll size, or usability.
      parameters:
        - name: site
          in: query
          schema:
            type: string
          description: Filter by warehouse or site code (e.g. wh1)
        - name: model
          in: query
          schema:
            type: string
          description: Filter by printer hardware model
        - name: paper_size
          in: query
          schema:
            type: string
          description: Filter by installed roll size (e.g. 4x6, 4x2, 2x1)
        - name: usable
          in: query
          schema:
            type: boolean
          description: Filter by operational usability
        - name: enabled
          in: query
          schema:
            type: boolean
          description: Filter by administrative enabled status
      responses:
        '200':
          description: List of printers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Printer'
                  count:
                    type: integer

  /printers/status:
    get:
      tags:
        - Fleet Visibility
      summary: Bulk Printer Status
      description: High-performance bulk status endpoint for warehouse dashboards (single round-trip).
      parameters:
        - name: ids
          in: query
          schema:
            type: string
          description: Comma-separated list of printer IDs. If omitted, returns all printers.
        - name: site
          in: query
          schema:
            type: string
        - name: paper_size
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Bulk fleet status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetStatusResponse'

  /printers/{printer_id}:
    get:
      tags:
        - Fleet Visibility
      summary: Get Printer Details
      parameters:
        - name: printer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Printer detail and current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Printer'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Fleet Visibility
      summary: Update Printer Attributes
      description: Update user-editable attributes (display name, site, custom label, remark, roll size). Admin only.
      security:
        - BearerAuth: []
      parameters:
        - name: printer_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                site:
                  type: string
                remark:
                  type: string
                custom_label:
                  type: string
                paper_size:
                  type: string
                media_width_mm:
                  type: number
                media_height_mm:
                  type: number
                dpi:
                  type: integer
                dpmm:
                  type: number
                orientation:
                  type: string
                media_orientation:
                  type: string
                print_direction:
                  type: string
                cjk_supported:
                  type: boolean
                cjk_font:
                  type: string
                fonts:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: Updated printer view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Printer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /printers/{printer_id}/status:
    get:
      tags:
        - Fleet Visibility
      summary: Get Single Printer Status
      description: Serves cached snapshot without touching physical TCP socket.
      parameters:
        - name: printer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  printer_id:
                    type: string
                  usable:
                    type: boolean
                  queue_depth:
                    type: integer
                  status:
                    $ref: '#/components/schemas/PrinterStatus'

  /printers/{printer_id}/jobs:
    get:
      tags:
        - Fleet Visibility
      summary: List Recent Printer Jobs
      parameters:
        - name: printer_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent jobs on this printer

  /printers/{printer_id}/test:
    post:
      tags:
        - Fleet Visibility
      summary: Dispatch Test Page
      description: |
        Prints a built-in test page for the printer's kind: an alignment label (ZPL),
        a receipt with Chinese text, a QR code, a barcode and a cut (ESC/POS), or an
        A4 page with a border and rulers (PDF, or PCL). Admin only.
      security:
        - BearerAuth: []
      parameters:
        - name: printer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Test page accepted and queued; `label` describes it (kind, size, columns)
        '409':
          description: No test page for this printer (e.g. an office printer that takes neither PDF nor PCL)

  /printers/{printer_id}/identify:
    post:
      tags:
        - Fleet Visibility
      summary: Query Printer Hardware Identity (~HI)
      description: Probes printer for model, serial, and firmware revision. Admin only.
      security:
        - BearerAuth: []
      parameters:
        - name: printer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hardware identity map

  /printers/{printer_id}/diagnostics:
    get:
      tags:
        - Fleet Visibility
      summary: Printer Diagnostics (~HI, ~HS, ^HH, ^HW)
      description: >
        Asks the printer how it is actually set up — identity, live status and its
        configuration dump (print width, label pitch, resolution, darkness, media type,
        offsets) — and lists warnings where that disagrees with the declared spec, such as
        a different roll width or resolution. Read-only: nothing is printed. Admin only.
      security:
        - BearerAuth: []
      parameters:
        - name: printer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            Diagnostics report. A query that failed is listed under `errors` (keys `hi`,
            `hs`, `hh`, `hw`) while the others are still reported. Label printers only:
            other printers answer 409 `not_supported_by_printer`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  printer_id: { type: string }
                  checked_at: { type: string, format: date-time }
                  identity:
                    type: object
                    properties:
                      model: { type: string }
                      firmware: { type: string }
                      dpmm: { type: number }
                  status: { $ref: '#/components/schemas/PrinterStatus' }
                  config:
                    type: object
                    properties:
                      dpi: { type: integer }
                      dpmm: { type: number }
                      print_width_mm: { type: number }
                      print_width_dots: { type: integer }
                      label_length_mm: { type: number, description: 'Measured pitch: label plus gap' }
                      label_length_dots: { type: integer }
                      label_top_dots: { type: integer }
                      left_position_dots: { type: integer }
                      darkness: { type: string }
                      print_speed: { type: string }
                      print_method: { type: string }
                      print_mode: { type: string }
                      media_type: { type: string }
                      language: { type: string }
                      head_usage: { type: string }
                      settings:
                        type: object
                        additionalProperties: { type: string }
                        description: Every line of the configuration dump, as printed
                  declared:
                    type: object
                    properties:
                      paper_size: { type: string }
                      media_width_mm: { type: number }
                      media_height_mm: { type: number }
                      dpi: { type: integer }
                  warnings:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum: [status_blocking, media_undeclared, width_mismatch, length_mismatch, dpi_mismatch, offset_set, direction_undeclared, not_zpl, cjk_font_missing, cjk_font_undeclared]
                        message: { type: string }
                  errors:
                    type: object
                    additionalProperties: { type: string }
                  raw_config: { type: string }
                  recorded:
                    type: array
                    items: { type: string }
                    description: >
                      Facts this run wrote to the printer record — an undeclared dpi or CJK
                      font filled in, or a declared one marked printer-verified
                  cjk_fonts:
                    type: array
                    description: Fonts stored on the printer (^HW) that can print CJK text
                    items:
                      type: object
                      properties:
                        name: { type: string, example: 'E:SIMSUN.FNT' }
                        size: { type: integer }
        '404':
          description: Unknown printer

  /printers/{printer_id}/maintenance:
    post:
      tags:
        - Fleet Visibility
      summary: Printer Maintenance (calibrate, label top, left shift)
      description: >
        Changes the printer. `calibrate` sends ~JC: the printer feeds a few blank labels
        while it re-measures the label gap. `label_top` sends ^LT with ^JUS, saving a
        vertical print offset on the printer (positive moves printing down). `left_shift`
        sends ^LS with ^JUS, saving a horizontal offset (positive moves printing left;
        reported as LEFT POSITION in diagnostics). Refused with
        409 while the printer has queued jobs or is printing. Admin only; logged.
      security:
        - BearerAuth: []
      parameters:
        - name: printer_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [calibrate, label_top, left_shift]
                dots:
                  type: integer
                  minimum: -120
                  maximum: 120
                  description: label_top and left_shift only
      responses:
        '200':
          description: Command sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  printer_id: { type: string }
                  action: { type: string }
                  sent: { type: string, example: '~JC' }
                  note: { type: string }
        '409':
          description: Printer busy (queued jobs or printing), or not a label printer (`not_supported_by_printer`)
        '422':
          description: Unknown action or offset out of range
        '502':
          description: Printer unreachable

  /printers/probe:
    post:
      tags:
        - Fleet Visibility
      summary: Probe All Printers
      description: Triggers an immediate refresh of all printer status caches. Admin only.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Probing initiated

  # ---------------------------------------------------------------- Print Jobs
  /jobs:
    post:
      tags:
        - Print Jobs
      summary: Dispatch Print Job (Idempotent)
      description: |
        Dispatches a ZPL print job to a target printer.
        Anchored on `(client_id, external_id)` for strict idempotency: duplicate requests return `200` with `replayed: true`.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
          description: Optional idempotency key (defaults to external_id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '202':
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '200':
          description: Job already submitted and replayed (idempotent deduplication)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '409':
          description: Idempotency conflict (same external_id with different payload) or printer disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Invalid request or unprocessable payload.
            Machine-readable `error.reason` codes:
            - `payload_too_large`: Payload exceeds maximum allowed size (default 32MB / 33,554,432 bytes, 0 for unlimited; configurable via `max_payload_bytes` to allow full CJK TrueType font files)
            - `payload_empty`: Payload has zero length
            - `missing_payload`: Neither `zpl` nor `payload_base64` was supplied
            - `duplicate_payload`: Both `zpl` and `payload_base64` were supplied
            - `invalid_base64`: `payload_base64` is not valid base64
            - `missing_printer_id`: `printer_id` is required
            - `missing_external_id`: `external_id` (or `Idempotency-Key`) is required for safe retries
            - `invalid_copies`: copies must be between 1 and max_copies (default 1000, admin configurable)
            - `invalid_page_copies`: page copies array count doesn't match multi-page ZPL format count
            - `invalid_priority`: priority must be `normal` or `high`
            - `invalid_format`: `format` is not a format CPS knows
            - `format_not_supported`: the printer does not take this format and it cannot be converted for it (e.g. ZPL to a receipt printer)
            - `document_unreadable`: the PDF or image does not decode
            - `pdf_conversion_unavailable`: the PDF needs converting for this printer and the server has no poppler (pdftoppm)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Printer queue is full (backpressure)

    get:
      tags:
        - Print Jobs
      summary: List Jobs
      description: Queries jobs with filters. Scoped to the authenticated client.
      security:
        - BearerAuth: []
      parameters:
        - name: printer_id
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [queued, sending, printed, sent_unknown, failed, cancelled]
        - name: external_id
          in: query
          schema:
            type: string
        - name: ids
          in: query
          description: Comma-separated list of job IDs for bulk status query (e.g. ?ids=job_1,job_2)
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of jobs

  /jobs/status:
    get:
      tags:
        - Print Jobs
      summary: Bulk Job Status by ID
      description: Query the status of multiple jobs in a single round trip via comma-separated IDs in the query string.
      security:
        - BearerAuth: []
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated list of job IDs (e.g. ?ids=job_1,job_2)
          schema:
            type: string
      responses:
        '200':
          description: Bulk job statuses and summary count breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobStatusResponse'

    post:
      tags:
        - Print Jobs
      summary: Bulk Job Status by ID (JSON Payload)
      description: Query the status of multiple jobs in a single round trip via JSON array payload.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Bulk job statuses and summary count breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobStatusResponse'

  /jobs/raw:
    post:
      tags:
        - Print Jobs
      summary: Dispatch a Raw Document
      description: |
        Send the document as the request body, without base64. The format comes from
        `?format=`, else from the Content-Type: `application/pdf`, `image/png`,
        `image/jpeg`. `application/octet-stream` or `text/plain` without `?format=`
        means ZPL.
      security:
        - BearerAuth: []
      parameters:
        - name: printer_id
          in: query
          required: true
          schema:
            type: string
        - name: external_id
          in: query
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [zpl, escpos, pdf, png, jpeg, pcl, postscript, pwg, urf]
        - name: copies
          in: query
          schema:
            type: integer
            default: 1
        - name: priority
          in: query
          schema:
            type: string
            enum: [normal, high]
        - name: biz_ref
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: Job accepted

  /jobs/batch:
    post:
      tags:
        - Print Jobs
      summary: Batch Dispatch Jobs
      description: Submit up to 200 jobs in one batch. Handled independently per item.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '200':
          description: Batch processing result

  /jobs/{job_id}:
    get:
      tags:
        - Print Jobs
      summary: Get Job Details
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobs/{job_id}/cancel:
    post:
      tags:
        - Print Jobs
      summary: Cancel Job
      description: Aborts a queued or in-flight job.
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job cancelled
        '409':
          description: Job already terminal (cannot be cancelled)

  /jobs/{job_id}/resolve:
    post:
      tags:
        - Print Jobs
      summary: Manually Resolve Sent-Unknown Job
      description: |
        Allows an operator to resolve a job in `sent_unknown` state after visual verification in the warehouse.
        - `resolution: printed`: Confirms the physical label was observed on the printer tray.
        - `resolution: failed`: Confirms the physical label did not print, enabling the client to safely retry.
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  enum: [printed, failed]
                note:
                  type: string
                  description: Optional verification note (e.g. "Checked tray, label #88213 is present")
      responses:
        '200':
          description: Job resolved and transitioned to terminal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Job is not in sent_unknown state or invalid resolution value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{job_id}/attempts:
    get:
      tags:
        - Print Jobs
      summary: Get Job Socket Retry Attempts
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Physical send attempts log

  # ---------------------------------------------------------------- Real-Time Events
  /events:
    get:
      tags:
        - Real-Time Events
      summary: Real-Time SSE Event Stream
      description: Subscribes to Server-Sent Events for `printer.status` and `job.state` transitions.
      security:
        - BearerAuth: []
      parameters:
        - name: topics
          in: query
          schema:
            type: string
          description: Comma-separated list of topics (e.g. printer.status,job.state)
        - name: printer_ids
          in: query
          schema:
            type: string
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  # ---------------------------------------------------------------- API Tokens
  /admin/tokens:
    post:
      tags:
        - API Tokens
      summary: Issue API Token
      description: Issue a business or operator credential. The secret is returned exactly once. Admin only.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id:
                  type: string
                role:
                  type: string
                  enum: [client, admin]
                  default: client
                ttl:
                  type: string
                  example: 90d
                note:
                  type: string
      responses:
        '201':
          description: Token created with secret

    get:
      tags:
        - API Tokens
      summary: List Issued Tokens
      description: List tokens with metadata (secrets are never stored or returned). Admin only.
      security:
        - BearerAuth: []
      parameters:
        - name: client_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Tokens list

  /admin/tokens/{token_id}:
    delete:
      tags:
        - API Tokens
      summary: Revoke Token
      security:
        - BearerAuth: []
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token revoked

  /admin/tokens/{token_id}/rotate:
    post:
      tags:
        - API Tokens
      summary: Rotate Token
      description: Revokes the old secret and generates a new secret with identical identity. Admin only.
      security:
        - BearerAuth: []
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: New secret generated

  # ---------------------------------------------------------------- Edge Agents
  /agents:
    get:
      tags:
        - Edge Agents
      summary: List Edge Agents
      description: Returns all enrolled edge agents and their health status.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of enrolled edge agents

  /agents/{agent_id}:
    delete:
      tags:
        - Edge Agents
      summary: Remove Edge Agent
      description: Deregisters an agent and removes all printers solely claimed by it. Admin only.
      security:
        - BearerAuth: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent removed

  /agents/register:
    post:
      tags:
        - Edge Agents
      summary: Agent Registration
      description: Called by cps-agent to register local USB printers. Exchanging a bootstrap token returns a durable credential.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, agent_addr]
              properties:
                agent_id:
                  type: string
                site:
                  type: string
                hostname:
                  type: string
                os:
                  type: string
                version:
                  type: string
                agent_addr:
                  type: string
                printers:
                  type: array
                  items:
                    $ref: '#/components/schemas/Printer'
      responses:
        '200':
          description: Registration successful

  /agents/heartbeat:
    post:
      tags:
        - Edge Agents
      summary: Agent Heartbeat
      description: Refreshes agent liveness and pushes local printer status snapshots.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                status:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/PrinterStatus'
      responses:
        '200':
          description: Heartbeat accepted

  /agents/{agent_id}/printers/{printer_id}/status:
    post:
      tags:
        - Edge Agents
      summary: Agent Push Single Printer Status
      description: Pushes immediate status change for a locally connected printer.
      security:
        - BearerAuth: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
        - name: printer_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterStatus'
      responses:
        '200':
          description: Status update accepted

  /admin/agents/enroll:
    post:
      tags:
        - Edge Agents
      summary: Enroll Agent (Generate Bootstrap Token)
      description: Issues a single-use bootstrap token for packing PC deployment. Admin only.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                site:
                  type: string
                ttl:
                  type: string
      responses:
        '201':
          description: One-time agent bootstrap token

  # ---------------------------------------------------------------- Network Discovery
  /admin/discovery:
    get:
      tags:
        - Network Discovery
      summary: Discovery Status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Status of network discovery service

  /admin/discovery/scan:
    post:
      tags:
        - Network Discovery
      summary: Trigger Discovery Scan
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Scan results and candidates

  /admin/discovery/candidates:
    get:
      tags:
        - Network Discovery
      summary: List Discovered Candidates
      security:
        - BearerAuth: []
      parameters:
        - name: dismissed
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of candidates

  /admin/discovery/candidates/{device_key}/adopt:
    post:
      tags:
        - Network Discovery
      summary: Adopt Candidate into Fleet
      security:
        - BearerAuth: []
      parameters:
        - name: device_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [printer_id]
              properties:
                printer_id:
                  type: string
                site:
                  type: string
                name:
                  type: string
                paper_size:
                  type: string
                media_width_mm:
                  type: number
                media_height_mm:
                  type: number
                dpi:
                  type: integer
                dpmm:
                  type: number
                orientation:
                  type: string
                media_orientation:
                  type: string
                print_direction:
                  type: string
                cjk_supported:
                  type: boolean
                cjk_font:
                  type: string
                fonts:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Candidate adopted into active fleet

  /admin/discovery/candidates/{device_key}/dismiss:
    post:
      tags:
        - Network Discovery
      summary: Dismiss Candidate
      security:
        - BearerAuth: []
      parameters:
        - name: device_key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Candidate dismissed

  # ---------------------------------------------------------------- Template Preview
  /admin/printers/{printer_id}/preview:
    post:
      tags:
        - Template Preview
      summary: Preview a Document on a Printer
      description: |
        Shows how a PDF or image would come out of this printer, first page only, as a
        PNG: the dots a receipt or label printer gets after conversion, or the page an
        office printer gets. Nothing is printed. The format comes from `?format=` or
        the Content-Type. Admin only.
      security:
        - BearerAuth: []
      parameters:
        - name: printer_id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [pdf, png, jpeg]
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: The first page as the printer would print it; `X-Document-Pages` gives the page count
          content:
            image/png:
              schema: { type: string, format: binary }
        '404':
          description: Unknown printer
        '422':
          description: "`document_unreadable`, `pdf_conversion_unavailable` or `format_not_supported`"
  /admin/preview:
    post:
      tags:
        - Template Preview
      summary: Render ZPL Preview Image
      description: Compiles and rasterizes ZPL into an image (PNG/SVG/PDF) at exact aspect ratio without printing. Admin only.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zpl]
              properties:
                zpl:
                  type: string
                width_mm:
                  type: number
                  default: 101.6
                height_mm:
                  type: number
                  default: 152.4
                dpmm:
                  type: integer
                  default: 8
                grayscale:
                  type: boolean
                  default: false
                upright:
                  type: boolean
                  default: true
                format:
                  type: string
                  enum: [png, svg, pdf]
                  default: png
      responses:
        '200':
          description: Rendered image binary
          headers:
            X-Render-Backend:
              schema:
                type: string
            X-Render-Width-Dots:
              schema:
                type: integer
            X-Render-Height-Dots:
              schema:
                type: integer
            X-Render-Duration-Ms:
              schema:
                type: integer
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary

  # ---------------------------------------------------------------- System & Observability
  /healthz:
    get:
      tags:
        - System & Observability
      summary: Liveness Probe
      description: Unauthenticated liveness check for container orchestrators.
      responses:
        '200':
          description: Service is healthy

  /readyz:
    get:
      tags:
        - System & Observability
      summary: Readiness Probe
      description: Unauthenticated readiness check verifying data store and registry status.
      responses:
        '200':
          description: Service is ready to serve traffic

  /metrics:
    get:
      tags:
        - System & Observability
      summary: Prometheus Metrics
      description: Standard Prometheus text-format exposition metrics for scraping.
      responses:
        '200':
          description: Prometheus metrics text
          content:
            text/plain:
              schema:
                type: string

  /openapi.json:
    get:
      tags:
        - System & Observability
      summary: OpenAPI Specification (JSON)
      responses:
        '200':
          description: Raw OpenAPI JSON document
          content:
            application/json:
              schema:
                type: object

  /openapi.yaml:
    get:
      tags:
        - System & Observability
      summary: OpenAPI Specification (YAML)
      responses:
        '200':
          description: Raw OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  schemas:
    Printer:
      type: object
      properties:
        printer_id:
          type: string
        name:
          type: string
        site:
          type: string
        model:
          type: string
        driver:
          type: string
          enum: [zebra9100, escpos9100, ipp, pdl9100, mock]
        kind:
          type: string
          enum: [label, receipt, document]
          description: What the printer is for. Defaults from the driver.
        formats:
          type: array
          items:
            type: string
          description: |
            Formats the printer takes as is — learned from the printer (IPP
            document-format-supported, PJL LANGUAGES, the USB device id) or declared.
        capabilities:
          type: array
          items:
            type: string
            enum: [test_print, diagnostics, maintenance, fonts]
          description: Tools beyond printing. diagnostics, maintenance and fonts are label-printer tools; for other printers those endpoints answer 409 not_supported_by_printer.
        host:
          type: string
        port:
          type: integer
          description: 9100 for raw-socket printers, 631 for IPP.
        path:
          type: string
          description: IPP resource path (e.g. ipp/print).
        enabled:
          type: boolean
        usable:
          type: boolean
        queue_depth:
          type: integer
        remark:
          type: string
        custom_label:
          type: string
        paper_size:
          type: string
          description: Standard roll size tag (e.g. 4x6, 100x150mm, 4x2, 2x1)
        media_width_mm:
          type: number
          description: Physical roll width in mm
        media_height_mm:
          type: number
          description: Physical roll height / pitch in mm
        dpi:
          type: integer
          description: Print resolution in dots per inch (e.g. 203, 300, 600)
        dpmm:
          type: number
          description: Print resolution in dots per mm (e.g. 8, 12, 24)
        resolution_source:
          type: string
          enum: [hi, config, default]
          description: Provenance of resolution (hi = verified via hardware ~HI probe, config = declared in config, default = system fallback)
        dpi_resolved_from_hi:
          type: boolean
          description: Whether DPI was verified directly from hardware ~HI query
        orientation:
          type: string
          description: Label orientation (normal, inverted, portrait, landscape)
        media_orientation:
          type: string
          description: Media feed alignment
        print_direction:
          type: string
          description: Print feed direction (top_first, bottom_first)
        available_fonts:
          type: array
          nullable: true
          description: >
            Fonts the printer reports it stores (^HW), read automatically once it is
            reachable. null = not known yet, [] = none. CJK fonts come first, flagged
            `cjk`. Use `name` in ZPL, e.g. ^CW1,E:SIMSUN.FNT then ^A1N.
          items:
            type: object
            properties:
              name: { type: string, example: 'E:SIMSUN.FNT' }
              size: { type: integer }
              cjk: { type: boolean }
        cjk_supported:
          type: boolean
          description: Whether the printer has a CJK font; derived from available_fonts once known
        cjk_font:
          type: string
          deprecated: true
          description: Declared CJK font (older configs). Prefer available_fonts.
        fonts:
          type: array
          deprecated: true
          items:
            type: string
          description: Declared font identifiers (older configs). Prefer available_fonts.
        font_source:
          type: string
          enum: [hi, config, default]
          description: Provenance of font info (hi = verified via hardware ~HI probe, config = declared in config, default = system fallback)
        font_resolved_from_hi:
          type: boolean
          description: Whether CJK font was verified directly from hardware ~HI query
        status:
          $ref: '#/components/schemas/PrinterStatus'

    PrinterStatus:
      type: object
      properties:
        state:
          type: string
          enum: [idle, printing, busy, media_low, media_out, ribbon_low, ribbon_out, head_error, door_open, paper_jam, toner_low, toner_out, error, offline, disabled, unknown]
        raw:
          type: string
        detail:
          type: string
        observed_at:
          type: string
          format: date-time
        stale:
          type: boolean

    FleetStatusResponse:
      type: object
      properties:
        count:
          type: integer
        usable:
          type: integer
        not_usable:
          type: integer
        observed_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/Printer'

    SubmitJobRequest:
      type: object
      required: [printer_id, external_id]
      properties:
        printer_id:
          type: string
        external_id:
          type: string
        zpl:
          type: string
          description: A ZPL label as text. For any other format use `payload_base64`.
        payload_base64:
          type: string
          description: The document, base64-encoded, in `format`.
        format:
          type: string
          enum: [zpl, escpos, pdf, png, jpeg, pcl, postscript, pwg, urf]
          default: zpl
          description: |
            What the payload is. `zpl` when omitted, so existing clients are unaffected.
            PDF, PNG and JPEG are converted for printers that do not take them as is.
        copies:
          type: integer
          default: 1
          description: |
            Copies to print (1..max_copies, default limit 1000, configurable by admin).
            IPP printers get it as a job attribute; a converted label as ^PQ; an ESC/POS
            receipt or PCL/PostScript document is sent that many times. A ZPL label
            sent as is carries its own quantity (^PQ).
        page_copies:
          type: array
          items:
            type: integer
          description: ZPL only. Targeted copy counts per ^XA...^XZ format page (e.g. [4, 1] for 4 full cartons + 1 tail remainder carton). If an entry is 0, that page is omitted.
        priority:
          type: string
          enum: [normal, high]
          default: normal
        biz_ref:
          type: string
        meta:
          type: object
          additionalProperties:
            type: string

    JobAcceptedResponse:
      type: object
      properties:
        job_id:
          type: string
        state:
          type: string
        printer_id:
          type: string
        external_id:
          type: string
        replayed:
          type: boolean
        links:
          type: object
          properties:
            self:
              type: string

    BulkJobStatusResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        count:
          type: integer
        summary:
          type: object
          properties:
            queued:
              type: integer
            sending:
              type: integer
            printed:
              type: integer
            sent_unknown:
              type: integer
            failed:
              type: integer
            cancelled:
              type: integer

    Job:
      type: object
      properties:
        job_id:
          type: string
        client_id:
          type: string
        external_id:
          type: string
        printer_id:
          type: string
        format:
          type: string
          description: What was sent to the printer.
        source_format:
          type: string
          description: What the client sent, when CPS converted it (e.g. pdf for a receipt sent as escpos).
        state:
          type: string
          enum: [queued, sending, printed, sent_unknown, failed, cancelled]
          description: |
            Lifecycle position of the dispatch job:
            - `queued`: Accepted by CPS, placed in per-printer FIFO queue.
            - `sending`: Worker dialed printer TCP socket and is actively transmitting bytes.
            - `printed`: Confirmed physical print. All payload bytes reached socket AND printer status query (^HS) confirmed physical completion and return to idle.
            - `sent_unknown`: Unconfirmed physical outcome. Bytes were written to socket, but confirmation timed out, connection dropped, or service restarted. Terminal for auto-retry to prevent duplicate physical labels on packages. Resolved manually by operator physical inspection.
            - `failed`: Job failed before transmission or partial socket write. Zero bytes confirmed on printer; safe to retry.
            - `cancelled`: Cancelled by operator while waiting in queue before transmission started.
        state_detail:
          type: string
          description: Detailed explanation of current state guarantees and safety rules
        status_message:
          type: string
          description: Short human-readable summary suitable for business console displays
        payload_bytes:
          type: integer
        copies:
          type: integer
        page_copies:
          type: array
          items:
            type: integer
          description: Distribution of copy counts across format pages
        attempts:
          type: integer
        last_error:
          type: string
        biz_ref:
          type: string
        queued_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Broad error classification (e.g. invalid_request, printer_not_found, queue_full)
            reason:
              type: string
              description: Specific granular machine-readable error reason for business UI logic
            message:
              type: string
              description: Human-readable error description
            details:
              type: object
              description: Optional diagnostic metadata (e.g. max_payload_bytes, queue_depth)

  responses:
    NotFound:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Action requires higher privileges (e.g. admin role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
