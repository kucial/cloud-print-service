services:
  cps:
    build: .
    image: cloud-print-service:dev
    restart: unless-stopped
    command: ["-config", "/etc/cps/config.json"]
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/etc/cps/config.json:ro
    environment:
      CPS_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "/cps", "-version"]
      interval: 30s
      timeout: 3s
      retries: 3
    # Printers live on the warehouse LAN; only outbound TCP 9100 is needed.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Virtual printers: speak ZPL on 9100+ and render every label to PNG.
  # Gallery UI: http://localhost:19200
  vprint:
    build: .
    restart: unless-stopped
    entrypoint: ["/vprint"]
    command:
      - -count=2
      - -id=wh1-pack
      - -base-port=19100
      - -base-admin-port=19200
      - -render
      - -render-dir=/labels
    ports:
      - "19100-19101:19100-19101"
      - "19200-19201:19200-19201"
    volumes:
      - vprint-labels:/labels
    profiles: ["sim"]

  # Optional high-fidelity renderer. Point vprint at it with
  #   -render-backend=labelize -labelize-url=http://labelize:8080
  # It renders the widest ZPL subset and is calibrated against the Labelary reference.
  labelize:
    image: ghcr.io/goodboy008/labelize:latest
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      LABELIZE_PLAYGROUND_ENABLED: "false"
    profiles: ["sim"]

  # Reference business-module integration (repo only; run it locally, not in production).
  demo-web:
    build: .
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/demo-web"]
    command: ["-url", "http://cps:8080", "-addr", ":8090"]
    ports:
      - "8091:8090"
    environment:
      CPS_TOKEN: "${CPS_DEMO_TOKEN:?set CPS_DEMO_TOKEN from: cpsctl token issue --client-id wms}"
      CPS_URL: "http://cps:8080"
    depends_on:
      - cps
    profiles: ["demo"]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cps
      POSTGRES_PASSWORD: cps
      POSTGRES_DB: cps
    ports:
      - "5432:5432"
    volumes:
      - cps-pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cps"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cps-pgdata:
  vprint-labels:
