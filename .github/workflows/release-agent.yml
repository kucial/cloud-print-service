name: release-agent

# Builds cps-agent for packing PCs (packaging/release.sh). Push a tag like `agent-v0.2.0` to publish a Gitea
# release; run it manually to get the same files as a workflow artifact only.
#
# The release is created through the Gitea API with the job token. If that token lacks
# release permission on this instance, add a repo secret RELEASE_TOKEN (a personal access
# token with write:repository) and it is used instead.
on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  release:
    name: build and publish
    # Gitea only: on GitHub, release.yml publishes (tags v*) through GitHub's own API.
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/agent-v* ]]; then
            version="${GITHUB_REF_NAME#agent-}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          command -v zip >/dev/null || { apt-get update -qq && apt-get install -y -qq zip >/dev/null; }

          packaging/release.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: cps-agent-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: token $TOKEN")
          body=$(jq -n --arg tag "$GITHUB_REF_NAME" --arg name "cps-agent $VERSION" \
            --arg body "cps-agent $VERSION for Windows and Linux, and cpsagent-*.tar.gz for koolshare ASUS routers. Install steps are in each archive's README.txt and docs/INSTALL.md; verify with SHA256SUMS." \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')
          id=$(curl -fsS "${auth[@]}" -H 'Content-Type: application/json' \
            -X POST "$API/releases" -d "$body" | jq -r .id)
          echo "release id $id"
          for f in dist/*; do
            curl -fsS "${auth[@]}" -X POST \
              "$API/releases/$id/assets?name=$(basename "$f")" \
              -F "attachment=@$f" >/dev/null
            echo "uploaded $(basename "$f")"
          done
