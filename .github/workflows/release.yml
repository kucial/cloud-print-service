name: release

# GitHub releases. Push a tag like `v0.3.0` and this publishes:
#   - a GitHub release with cps-server-* (cps + cpsctl for Linux, macOS, Windows), cps-agent-*
#     (Windows, Linux, ASUS routers), cpsagent-*-koolshare and SHA256SUMS (packaging/release.sh);
#   - the server image ghcr.io/kucial/cloud-print-service:<version> and :latest
#     (linux/amd64 and linux/arm64).
# A manual run builds the same files as a workflow artifact and publishes nothing.
# Gitea reads this directory too; there, release-agent.yml (tags agent-v*) does the work.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GO_VERSION: "1.26"

jobs:
  files:
    name: binaries and release
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: test
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: build
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          packaging/release.sh "$version" --server

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-print-service-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)   # v1.2.0-rc.1
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Cloud Print Service $VERSION" \
            --generate-notes ${prerelease[@]+"${prerelease[@]}"} \
            --notes "Server: \`cps-server-$VERSION-<os>-<arch>\` (cps + cpsctl), or \`docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION#v}\`.
          USB agent: \`cps-agent-$VERSION-<os>-<arch>\`; ASUS routers: \`cps-agent-$VERSION-asuswrt.tar.gz\`, or \`cpsagent-$VERSION-koolshare.tar.gz\` for the koolshare software center.
          Install guide: docs/INSTALL.md. Verify downloads with SHA256SUMS."

  image:
    name: container image
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          # latest only for a final release, not for v1.2.0-rc.1
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
